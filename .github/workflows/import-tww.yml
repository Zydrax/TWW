name: Import TWW source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout TWW
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: true

      - name: Verify runner
        shell: bash
        run: |
          set -euxo pipefail
          uname -a
          df -h
          git --version
          unzip -v | head

      - name: Download Draconic-WoW source
        shell: bash
        run: |
          set -euxo pipefail
          URL='https://drive.usercontent.google.com/download?id=1ezrSJkDQQecwQnCk_Ztj-xu63yb9al8N&export=download&authuser=0'
          ZIP="$RUNNER_TEMP/Draconic-WoW-master.zip"
          curl -L --fail --retry 8 --retry-delay 5 --connect-timeout 30 "$URL" -o "$ZIP"
          test -s "$ZIP"
          ls -lh "$ZIP"
          file "$ZIP"
          unzip -tq "$ZIP"

      - name: Extract source into repository
        shell: bash
        run: |
          set -euxo pipefail
          ZIP="$RUNNER_TEMP/Draconic-WoW-master.zip"
          OUT="$RUNNER_TEMP/tww-extracted"
          mkdir -p "$OUT"
          unzip -q "$ZIP" -d "$OUT"

          SOURCE_ROOT="$OUT"
          FIRST="$(find "$OUT" -mindepth 1 -maxdepth 1 -type d | head -n 1 || true)"
          COUNT="$(find "$OUT" -mindepth 1 -maxdepth 1 | wc -l)"
          if [ "$COUNT" -eq 1 ] && [ -n "$FIRST" ]; then
            SOURCE_ROOT="$FIRST"
          fi

          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/workflows/import-tww.yml' \
            "$SOURCE_ROOT/" "$GITHUB_WORKSPACE/"

          find "$GITHUB_WORKSPACE" -mindepth 2 -type d -name .git -prune -exec rm -rf '{}' + || true

      - name: Track files over 95 MB with Git LFS
        shell: bash
        run: |
          set -euxo pipefail
          git lfs install --local
          while IFS= read -r -d '' file; do
            path="${file#./}"
            echo "LFS: $path"
            git lfs track "$path"
          done < <(find . -type f -not -path './.git/*' -size +95M -print0)

      - name: Commit imported source
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Import Draconic-WoW source into TWW [skip import]'
          git push origin HEAD:main
